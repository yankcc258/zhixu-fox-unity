name: Desktop attention contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  attention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project Tests/Attention/Attention.csproj
