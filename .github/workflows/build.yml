# 自动打包：Actions 页面手动点「Run workflow」，或者推一个 v* 标签（会顺便发 Release）。
# 第一次用之前要在仓库 Settings → Secrets and variables → Actions 里加三个机密（只能主人自己加）：
#   UNITY_EMAIL / UNITY_PASSWORD：Unity 账号
#   UNITY_LICENSE：许可证文件（.ulf）的全文；Windows 上在 C:\ProgramData\Unity\Unity_lic.ulf
# 详见 https://game.ci/docs/github/activation
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Unity 的 Docker 镜像很大，先腾点地方
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-win64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-win64-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.28f1
          targetPlatform: StandaloneWindows64
          buildMethod: Kiko.EditorTools.KikoSetup.Ci
          versioning: None
          allowDirtyBuild: true

      - name: Zip
        run: |
          sudo chown -R $USER Builds
          cd Builds && zip -qr ../ZhixuFox-win64.zip ZhixuFox -x '*_BurstDebugInformation_DoNotShip*' '*_BackUpThisFolder_ButDontShipItWithYourGame*'
          ls -lh ../ZhixuFox-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ZhixuFox-win64
          path: ZhixuFox-win64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ZhixuFox-win64.zip
          generate_release_notes: true
